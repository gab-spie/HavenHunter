[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "havenhunter"
version = "1.0.0"
description = "Source-agnostic housing-search aggregation and alerting engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabin Spiewak" }]
dependencies = [
    "python-telegram-bot[job-queue]>=20.7",
    "PyYAML>=6.0",
    "gspread>=6.0",
    "google-auth>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
